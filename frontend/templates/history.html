<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>History</title>
  <link rel="stylesheet" href="/static/styles.css"/>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a href="/">← Home</a>
      <div class="spacer"></div>
      <a href="/rubrics">Rubric Manager</a>
      <span>•</span>
      <a href="/docs" target="_blank">Swagger</a>
    </div>

    <h1>Lịch sử chấm</h1>

    <table class="table">
      <thead>
        <tr>
          <th>Thời gian</th>
          <th>File</th>
          <th>Rubric version</th>
          <th>Total raw</th>
          <th>Total adjusted</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for it in items %}
        <tr>
          <td>{{ it.created_at }}</td>
          <td>{{ it.file_name }}</td>
          <td>{{ it.rubric_version }}</td>
          <td class="right">{{ "%.2f"|format(it.total_raw) }}</td>
          <td class="right">{{ "%.2f"|format(it.total_adjusted) }}</td>
          <td><a class="btn small" href="/result/{{ it.id }}">Open</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
